<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 方案 A「瞳 · 取景框」：虹膜外环 = AI 之眼；中央检测框四角括号 + 瞳点 = 目标被锁定。
       语义一步讲清产品：AI 眼睛盯着现场，检测框锁定工件。 -->
  <defs>
    <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="0.5" stop-color="#F97316"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <!-- 渐变圆角方底板（C 方案熔金流场同源渐变） -->
  <rect width="128" height="128" rx="30" fill="url(#gA)"/>
  <!-- 虹膜外环 -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <!-- 检测框四角括号（bounding box 简写形） -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 58 v-8 q0 -4 4 -4 h8"/>
    <path d="M72 46 h8 q4 0 4 4 v8"/>
    <path d="M84 70 v8 q0 4 -4 4 h-8"/>
    <path d="M56 82 h-8 q-4 0 -4 -4 v-8"/>
  </g>
  <!-- 瞳点：目标被锁定 -->
  <circle cx="64" cy="64" r="7" fill="#FFFFFF"/>
</svg>
