<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 方案 C「鸢尾绽放」：Iris 的第二含义 = 鸢尾花。三片几何花瓣围绕中心瞳点放射，
       "智能从瞳孔中绽放"。五款里唯一的非圆形主形，品牌差异化最强。 -->
  <defs>
    <linearGradient id="gC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="0.5" stop-color="#F97316"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#gC)"/>
  <!-- 三片饱满水滴形花瓣，围绕中心 120° 旋转复制（加宽加长，避免"风车感"） -->
  <g fill="#FFFFFF">
    <path d="M64 24 C53 37 52 47 64 54 C76 47 75 37 64 24 Z"/>
    <path d="M64 24 C53 37 52 47 64 54 C76 47 75 37 64 24 Z" transform="rotate(120 64 64)"/>
    <path d="M64 24 C53 37 52 47 64 54 C76 47 75 37 64 24 Z" transform="rotate(240 64 64)"/>
  </g>
  <!-- 中心瞳点 -->
  <circle cx="64" cy="64" r="7" fill="#FFFFFF"/>
</svg>
