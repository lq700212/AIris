<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 方案 E「守护之眼」：盾牌（防错 error-proofing / 质量守护）内嵌一只睁开的眼。
       眼洞用 evenodd 挖空透出底板渐变 = 眼白，中央白瞳点 = AI 注视。
       工业防护感最强，贴"防错"定位。 -->
  <defs>
    <linearGradient id="gE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="0.5" stop-color="#F97316"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#gE)"/>
  <!-- 盾形（evenodd 挖出杏仁眼洞，洞透出渐变底板作眼白） -->
  <path fill-rule="evenodd" fill="#FFFFFF"
        d="M64 20 L98 33 V62 C98 85 84 100 64 108 C44 100 30 85 30 62 V33 Z
           M40 62 Q64 40 88 62 Q64 84 40 62 Z"/>
  <!-- 瞳点 -->
  <circle cx="64" cy="62" r="7.5" fill="#FFFFFF"/>
</svg>
