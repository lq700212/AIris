<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 方案 F「检测框之瞳」：一个巨大的 bounding box 四角括号锁住中心瞳环。
       全场最简几何（4 条折线 + 1 个环），小尺寸辨识度最高，
       "检测框锁定目标" = 产品最核心的一个动作。 -->
  <defs>
    <linearGradient id="gF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="0.5" stop-color="#F97316"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#gF)"/>
  <!-- 检测框四角括号（粗白，圆角） -->
  <g fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 54 V46 Q38 38 46 38 H54"/>
    <path d="M74 38 H82 Q90 38 90 46 V54"/>
    <path d="M90 74 V82 Q90 90 82 90 H74"/>
    <path d="M54 90 H46 Q38 90 38 82 V74"/>
  </g>
  <!-- 瞳环：白环 + 中心透出渐变底板（evenodd 挖洞），即"框中瞳" -->
  <path fill-rule="evenodd" fill="#FFFFFF"
        d="M49 64 a15 15 0 1 0 30 0 a15 15 0 1 0 -30 0 Z
           M57.5 64 a6.5 6.5 0 1 0 13 0 a6.5 6.5 0 1 0 -13 0 Z"/>
</svg>
